# ── Project identity ───────────────────────────────────────────────────────────
sonar.projectKey=deployma
sonar.projectName=Deployma Grocery App
sonar.projectVersion=1.0

# ── Source roots (both frontend and backend) ────────────────────────────────────
sonar.sources=backend/src,frontend/src

# ── Exclude generated / dependency files from analysis ─────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/tests/**,\
  frontend/src/assets/**

# ── Test file locations (so Sonar can link coverage to them) ───────────────────
sonar.test.inclusions=backend/tests/**/*.ts

# ── Coverage: vitest outputs lcov format to backend/coverage/lcov.info ─────────
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Files excluded from coverage obligation (tests themselves, generated types)
sonar.coverage.exclusions=\
  backend/tests/**,\
  backend/src/apps/server/lambda.ts,\
  frontend/src/**

# ── TypeScript settings ────────────────────────────────────────────────────────
sonar.typescript.tsconfigPath=backend/tsconfig.json

sonar.sourceEncoding=UTF-8
