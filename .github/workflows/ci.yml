name: CI — Code Scan

# Runs on every push and every pull request (all branches)
on:
  push:
  pull_request:
    branches: [main, lat]

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend-type-check:
    name: "Frontend: Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: vue-tsc type check
        working-directory: frontend
        run: npm run type-check

  frontend-security-audit:
    name: "Frontend: Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: npm audit (high+)
        working-directory: frontend
        # || true — report issues but don't block the pipeline until audits are clean
        run: npm audit --audit-level=high --omit=dev || true

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend-type-check:
    name: "Backend: Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: tsc --noEmit
        working-directory: backend
        run: npm run type-check

  backend-tests:
    name: "Backend: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: vitest --run
        working-directory: backend
        run: npm test -- --run

  backend-security-audit:
    name: "Backend: Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: npm audit (high+)
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev || true
